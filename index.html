<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Psikotes Sugar Group Schools</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="https://raw.githubusercontent.com/Pragas123/assets/refs/heads/main/nmqo6a.png"
  >

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS utama -->
  <link rel="stylesheet" href="./style.css">

  <style>

    /* =========================================
       MENCEGAH SEMUA GAMBAR DI-DRAG
       ========================================= */

    img {
      -webkit-user-drag: none;
      user-drag: none;

      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;

      pointer-events: auto;
    }


    /* =========================================
       ANIMASI LOGO NORMAL
       ========================================= */

    .password-logo {
      animation:
        logoJumpIn 1s ease-out both,
        logoFloating 2.5s ease-in-out 1s infinite;

      transform-origin: center bottom;
      will-change: transform, opacity;
    }


    /* =========================================
       LOGO JUMP IN
       ========================================= */

    @keyframes logoJumpIn {

      0% {
        opacity: 0;
        transform: translateY(70px) scale(0.75);
      }

      42% {
        opacity: 1;
        transform: translateY(-25px) scale(1.08);
      }

      62% {
        transform: translateY(8px) scale(0.97);
      }

      80% {
        transform: translateY(-10px) scale(1.03);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    /* =========================================
       LOGO FLOATING
       ========================================= */

    @keyframes logoFloating {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }

    }


    /* =========================================
       OVERLAY MERAH FULL SCREEN
       ========================================= */

    #passwordErrorOverlay {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      background:
        radial-gradient(
          circle at center,
          rgba(255, 0, 0, 0.42) 0%,
          rgba(255, 0, 0, 0.28) 35%,
          rgba(180, 0, 0, 0.38) 65%,
          rgba(100, 0, 0, 0.52) 100%
        );

      opacity: 0;

      pointer-events: none;

      z-index: 99999;

      mix-blend-mode: multiply;

    }


    /* =========================================
       ANIMASI FLASH MERAH FULL SCREEN
       ========================================= */

    #passwordErrorOverlay.password-error-flash {

      animation:
        passwordFullRedFlash 1.15s ease-in-out;

    }


    @keyframes passwordFullRedFlash {

      0% {
        opacity: 0;
      }

      8% {
        opacity: 0.95;
      }

      18% {
        opacity: 0.25;
      }

      28% {
        opacity: 0.85;
      }

      40% {
        opacity: 0.18;
      }

      55% {
        opacity: 0.72;
      }

      70% {
        opacity: 0.12;
      }

      85% {
        opacity: 0.45;
      }

      100% {
        opacity: 0;
      }

    }


    /* =========================================
       PASSWORD SCREEN BERGETAR
       ========================================= */

    .password-screen-error {

      animation:
        passwordScreenShake 0.95s cubic-bezier(.36,.07,.19,.97);

    }


    @keyframes passwordScreenShake {

      0% {
        transform: translate3d(0, 0, 0);
      }

      8% {
        transform: translate3d(-10px, 3px, 0);
      }

      16% {
        transform: translate3d(12px, -3px, 0);
      }

      24% {
        transform: translate3d(-14px, 2px, 0);
      }

      32% {
        transform: translate3d(13px, -2px, 0);
      }

      40% {
        transform: translate3d(-11px, 2px, 0);
      }

      48% {
        transform: translate3d(10px, -2px, 0);
      }

      56% {
        transform: translate3d(-8px, 1px, 0);
      }

      64% {
        transform: translate3d(7px, -1px, 0);
      }

      72% {
        transform: translate3d(-5px, 1px, 0);
      }

      82% {
        transform: translate3d(4px, 0, 0);
      }

      92% {
        transform: translate3d(-2px, 0, 0);
      }

      100% {
        transform: translate3d(0, 0, 0);
      }

    }


    /* =========================================
       LOGO PASSWORD SALAH
       ========================================= */

    .password-image-error {

      animation:
        passwordImageError 0.95s cubic-bezier(.36,.07,.19,.97);

      filter:
        brightness(0.55)
        saturate(3)
        contrast(1.25)
        drop-shadow(0 0 10px rgba(255, 0, 0, 1))
        drop-shadow(0 0 25px rgba(255, 0, 0, 1))
        drop-shadow(0 0 50px rgba(255, 0, 0, 0.95))
        drop-shadow(0 0 80px rgba(255, 0, 0, 0.7));

    }


    /* =========================================
       GETAR LOGO KUAT
       ========================================= */

    @keyframes passwordImageError {

      0% {
        transform: translateX(0) scale(1);
      }

      8% {
        transform: translateX(-18px) rotate(-2deg) scale(1.04);
      }

      16% {
        transform: translateX(20px) rotate(2deg) scale(1.06);
      }

      24% {
        transform: translateX(-22px) rotate(-2deg) scale(1.05);
      }

      32% {
        transform: translateX(21px) rotate(2deg) scale(1.04);
      }

      40% {
        transform: translateX(-18px) rotate(-1.5deg) scale(1.03);
      }

      48% {
        transform: translateX(16px) rotate(1.5deg) scale(1.02);
      }

      56% {
        transform: translateX(-13px) rotate(-1deg);
      }

      64% {
        transform: translateX(10px) rotate(1deg);
      }

      72% {
        transform: translateX(-7px);
      }

      80% {
        transform: translateX(5px);
      }

      90% {
        transform: translateX(-2px);
      }

      100% {
        transform: translateX(0) rotate(0) scale(1);
      }

    }


    /* =========================================
       INPUT PASSWORD SALAH
       ========================================= */

    .password-input-error {

      animation:
        passwordInputShake 0.8s ease-in-out;

      border-color: #ff0000 !important;

      box-shadow:
        0 0 0 3px rgba(255, 0, 0, 0.25),
        0 0 18px rgba(255, 0, 0, 0.8),
        0 0 35px rgba(255, 0, 0, 0.55) !important;

      background-color:
        rgba(255, 0, 0, 0.12) !important;

    }


    @keyframes passwordInputShake {

      0% {
        transform: translateX(0);
      }

      15% {
        transform: translateX(-9px);
      }

      30% {
        transform: translateX(9px);
      }

      45% {
        transform: translateX(-8px);
      }

      60% {
        transform: translateX(7px);
      }

      75% {
        transform: translateX(-5px);
      }

      90% {
        transform: translateX(3px);
      }

      100% {
        transform: translateX(0);
      }

    }


    /* =========================================
       TOMBOL MASUK SALAH
       ========================================= */

    .password-submit-error {

      animation:
        passwordButtonShake 0.8s ease-in-out;

      background:
        linear-gradient(
          135deg,
          #ff0000,
          #b00000
        ) !important;

      box-shadow:
        0 0 12px rgba(255, 0, 0, 0.8),
        0 0 28px rgba(255, 0, 0, 0.7),
        0 0 50px rgba(255, 0, 0, 0.45) !important;

    }


    @keyframes passwordButtonShake {

      0% {
        transform: translateX(0) scale(1);
      }

      15% {
        transform: translateX(-8px) scale(1.04);
      }

      30% {
        transform: translateX(8px) scale(1.04);
      }

      45% {
        transform: translateX(-7px) scale(1.03);
      }

      60% {
        transform: translateX(6px) scale(1.02);
      }

      75% {
        transform: translateX(-4px);
      }

      100% {
        transform: translateX(0) scale(1);
      }

    }


    /* =========================================
       PESAN ERROR
       ========================================= */

    .password-error-active {

      animation:
        passwordErrorPulse 0.95s ease-in-out;

      color: #ff0000 !important;

      font-weight: 700;

      text-shadow:
        0 0 5px rgba(255, 0, 0, 0.5),
        0 0 15px rgba(255, 0, 0, 0.7);

    }


    @keyframes passwordErrorPulse {

      0% {
        opacity: 0.4;
        transform: scale(0.9);
      }

      20% {
        opacity: 1;
        transform: scale(1.08);
      }

      40% {
        opacity: 0.8;
        transform: scale(1);
      }

      60% {
        opacity: 1;
        transform: scale(1.05);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================================
       FLASH MERAH TAMBAHAN DI PASSWORD SCREEN
       ========================================= */

    .password-screen::after {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 20%,
          rgba(255, 0, 0, 0.0) 40%,
          rgba(255, 0, 0, 0.0) 100%
        );

      opacity: 0;

      z-index: 5;

    }


    .password-screen.password-red-active::after {

      animation:
        passwordRedPulse 1.15s ease-in-out;

    }


    @keyframes passwordRedPulse {

      0% {
        opacity: 0;
        background:
          radial-gradient(
            circle at center,
            transparent 10%,
            rgba(255, 0, 0, 0.0) 30%,
            rgba(255, 0, 0, 0.0) 100%
          );
      }

      15% {
        opacity: 1;
        background:
          radial-gradient(
            circle at center,
            rgba(255, 0, 0, 0.10) 0%,
            rgba(255, 0, 0, 0.45) 50%,
            rgba(120, 0, 0, 0.75) 100%
          );
      }

      30% {
        opacity: 0.25;
      }

      45% {
        opacity: 0.9;
      }

      60% {
        opacity: 0.2;
      }

      75% {
        opacity: 0.7;
      }

      100% {
        opacity: 0;
      }

    }


    /* =========================================
       PASTIKAN PASSWORD SCREEN BISA
       MENJADI CONTAINER OVERLAY
       ========================================= */

    .password-screen {

      position: relative;

    }

  </style>
</head>


<body>


  <!-- =========================================
       OVERLAY ERROR FULL SCREEN
       ========================================= -->

  <div
    id="passwordErrorOverlay"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       HALAMAN PASSWORD
       ========================================= -->

  <div
    class="password-screen"
    id="passwordScreen"
  >

    <img
      src="https://raw.githubusercontent.com/Pragas123/assets/refs/heads/main/nmqo6a.png"
      alt="Logo Psikotes Sugar Group Schools"
      class="password-logo"
      id="passwordLogo"
      draggable="false"
    >


    <div
      class="welcome-message"
      id="welcomeMessage"
    >
      Selamat datang di Psikotes Sugar Group Schools
    </div>


    <div
      class="password-form"
      id="passwordForm"
    >

      <input
        type="password"
        class="password-input"
        id="passwordInput"
        placeholder="Masukkan Kode Akses"
        autocomplete="off"
      >


      <button
        type="button"
        class="password-submit"
        onclick="checkPassword()"
      >
        Masuk
      </button>


      <div
        class="password-error"
        id="passwordError"
      ></div>

    </div>

  </div>


  <!-- =========================================
       TEMPAT APLIKASI UTAMA
       ========================================= -->

  <div id="app"></div>


  <!-- =========================================
       CANVAS GRAFIK DISC
       ========================================= -->

  <canvas
    id="discMost"
    width="170"
    height="420"
    style="display: none;"
  ></canvas>


  <canvas
    id="discLeast"
    width="170"
    height="420"
    style="display: none;"
  ></canvas>


  <canvas
    id="discChange"
    width="170"
    height="420"
    style="display: none;"
  ></canvas>


  <!-- =========================================
       CANVAS GRAFIK KRAEPELIN
       ========================================= -->

  <canvas
    id="kraeplinGraph"
    width="1000"
    height="320"
    style="display: none;"
  ></canvas>


  <!-- =========================================
       jsPDF
       ========================================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ></script>


  <!-- =========================================
       Chart.js
       ========================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js"
  ></script>


  <!-- =========================================
       JavaScript utama
       ========================================= -->

  <script src="./script.js"></script>


  <script>

    /* =========================================
       SUARA PASSWORD SALAH
       ========================================= */

    let wrongPasswordAudioContext = null;


    function playWrongPasswordAlarm() {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        if (!AudioContext) return;


        if (!wrongPasswordAudioContext) {

          wrongPasswordAudioContext =
            new AudioContext();

        }


        const ctx =
          wrongPasswordAudioContext;


        if (ctx.state === "suspended") {

          ctx.resume();

        }


        const now =
          ctx.currentTime;


        /* =====================================
           SUARA "TET"
           ===================================== */

        const osc1 =
          ctx.createOscillator();

        const gain1 =
          ctx.createGain();


        osc1.type = "square";


        osc1.frequency.setValueAtTime(
          880,
          now
        );


        gain1.gain.setValueAtTime(
          0.0001,
          now
        );


        gain1.gain.exponentialRampToValueAtTime(
          0.48,
          now + 0.015
        );


        gain1.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 0.13
        );


        osc1.connect(gain1);

        gain1.connect(
          ctx.destination
        );


        osc1.start(now);

        osc1.stop(
          now + 0.14
        );


        /* =====================================
           SUARA "TEEEEEET"
           ===================================== */

        const osc2 =
          ctx.createOscillator();

        const gain2 =
          ctx.createGain();


        osc2.type = "square";


        osc2.frequency.setValueAtTime(
          650,
          now + 0.18
        );


        osc2.frequency.linearRampToValueAtTime(
          760,
          now + 0.65
        );


        gain2.gain.setValueAtTime(
          0.0001,
          now + 0.18
        );


        gain2.gain.exponentialRampToValueAtTime(
          0.48,
          now + 0.20
        );


        gain2.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 0.78
        );


        osc2.connect(gain2);

        gain2.connect(
          ctx.destination
        );


        osc2.start(
          now + 0.18
        );


        osc2.stop(
          now + 0.80
        );


      } catch (error) {

        console.warn(
          "Alarm password salah gagal diputar:",
          error
        );

      }

    }


    /* =========================================
       EFEK PASSWORD SALAH
       ========================================= */

    function passwordWrongImageEffect() {

      const passwordScreen =
        document.getElementById(
          "passwordScreen"
        );


      const overlay =
        document.getElementById(
          "passwordErrorOverlay"
        );


      const logo =
        document.getElementById(
          "passwordLogo"
        );


      const input =
        document.getElementById(
          "passwordInput"
        );


      const button =
        document.querySelector(
          ".password-submit"
        );


      const error =
        document.getElementById(
          "passwordError"
        );


      /* =====================================
         OVERLAY FULL SCREEN
         ===================================== */

      if (overlay) {

        overlay.classList.remove(
          "password-error-flash"
        );

        void overlay.offsetWidth;

        overlay.classList.add(
          "password-error-flash"
        );

      }


      /* =====================================
         PASSWORD SCREEN
         ===================================== */

      if (passwordScreen) {

        passwordScreen.classList.remove(
          "password-screen-error",
          "password-red-active"
        );

        void passwordScreen.offsetWidth;

        passwordScreen.classList.add(
          "password-screen-error",
          "password-red-active"
        );

      }


      /* =====================================
         LOGO
         ===================================== */

      if (logo) {

        logo.classList.remove(
          "password-image-error"
        );

        void logo.offsetWidth;

        logo.classList.add(
          "password-image-error"
        );

      }


      /* =====================================
         INPUT
         ===================================== */

      if (input) {

        input.classList.remove(
          "password-input-error"
        );

        void input.offsetWidth;

        input.classList.add(
          "password-input-error"
        );

      }


      /* =====================================
         BUTTON
         ===================================== */

      if (button) {

        button.classList.remove(
          "password-submit-error"
        );

        void button.offsetWidth;

        button.classList.add(
          "password-submit-error"
        );

      }


      /* =====================================
         ERROR TEXT
         ===================================== */

      if (error) {

        error.classList.remove(
          "password-error-active"
        );

        void error.offsetWidth;

        error.classList.add(
          "password-error-active"
        );

      }


      /* =====================================
         HAPUS CLASS SETELAH SELESAI
         ===================================== */

      setTimeout(function () {

        if (overlay) {

          overlay.classList.remove(
            "password-error-flash"
          );

        }


        if (passwordScreen) {

          passwordScreen.classList.remove(
            "password-screen-error",
            "password-red-active"
          );

        }


        if (logo) {

          logo.classList.remove(
            "password-image-error"
          );

        }


        if (input) {

          input.classList.remove(
            "password-input-error"
          );

        }


        if (button) {

          button.classList.remove(
            "password-submit-error"
          );

        }


        if (error) {

          error.classList.remove(
            "password-error-active"
          );

        }

      }, 1200);

    }


    /* =========================================
       JALANKAN SEMUA EFEK
       ========================================= */

    function runWrongPasswordEffects() {

      passwordWrongImageEffect();

      playWrongPasswordAlarm();

    }


    /* =========================================
       MENCEGAH GAMBAR DI-DRAG
       ========================================= */

    document.addEventListener(
      "dragstart",
      function (event) {

        if (
          event.target instanceof
          HTMLImageElement
        ) {

          event.preventDefault();

        }

      }
    );


    /* =========================================
       MENONAKTIFKAN KLIK KANAN
       ========================================= */

    document.addEventListener(
      "contextmenu",
      function (event) {

        event.preventDefault();

        return false;

      }
    );


    /* =========================================
       DRAG GAMBAR
       ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        document
          .querySelectorAll("img")
          .forEach(function (image) {

            image.setAttribute(
              "draggable",
              "false"
            );

          });

      }
    );


    /* =========================================
       OBSERVER GAMBAR DINAMIS
       ========================================= */

    const imageObserver =
      new MutationObserver(
        function (mutations) {

          mutations.forEach(
            function (mutation) {

              mutation.addedNodes.forEach(
                function (node) {

                  if (
                    node instanceof
                    HTMLImageElement
                  ) {

                    node.setAttribute(
                      "draggable",
                      "false"
                    );

                  }


                  if (
                    node instanceof
                    HTMLElement
                  ) {

                    node
                      .querySelectorAll("img")
                      .forEach(
                        function (image) {

                          image.setAttribute(
                            "draggable",
                            "false"
                          );

                        }
                      );

                  }

                }
              );

            }
          );

        }
      );


    imageObserver.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );


    /* =========================================
       DETEKSI PASSWORD SALAH
       SETIAP KLIK
       ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const loginButton =
          document.querySelector(
            ".password-submit"
          );


        const passwordInput =
          document.getElementById(
            "passwordInput"
          );


        const passwordError =
          document.getElementById(
            "passwordError"
          );


        if (
          !loginButton ||
          !passwordInput ||
          !passwordError
        ) {

          return;

        }


        /* =====================================
           KLIK TOMBOL
           ===================================== */

        loginButton.addEventListener(
          "click",
          function () {

            setTimeout(
              function () {

                const errorText =
                  passwordError.textContent.trim();


                const passwordScreen =
                  document.getElementById(
                    "passwordScreen"
                  );


                if (
                  errorText !== "" &&
                  passwordScreen
                ) {

                  runWrongPasswordEffects();

                }

              },
              100
            );

          }
        );


        /* =====================================
           ENTER
           ===================================== */

        passwordInput.addEventListener(
          "keydown",
          function (event) {

            if (
              event.key !== "Enter"
            ) {

              return;

            }


            setTimeout(
              function () {

                const errorText =
                  passwordError.textContent.trim();


                const passwordScreen =
                  document.getElementById(
                    "passwordScreen"
                  );


                if (
                  errorText !== "" &&
                  passwordScreen
                ) {

                  runWrongPasswordEffects();

                }

              },
              100
            );

          }
        );

      }
    );

  </script>


</body>

</html>
