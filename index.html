<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Psikotes Sugar Group Schools</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="https://raw.githubusercontent.com/Pragas123/assets/refs/heads/main/nmqo6a.png"
  >

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS utama -->
  <link rel="stylesheet" href="./style.css">

  <style>

    /* =========================================
       MENCEGAH SEMUA GAMBAR DI-DRAG
       ========================================= */

    img {
      -webkit-user-drag: none;
      user-drag: none;

      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;

      pointer-events: auto;
    }


    /* =========================================
       ANIMASI LOGO
       ========================================= */

    .password-logo {
      animation:
        logoJumpIn 1s ease-out both,
        logoFloating 2.5s ease-in-out 1s infinite;

      transform-origin: center bottom;
      will-change: transform, opacity;
    }


    /* =========================================
       LOGO JUMP IN
       ========================================= */

    @keyframes logoJumpIn {

      0% {
        opacity: 0;
        transform: translateY(70px) scale(0.75);
      }

      42% {
        opacity: 1;
        transform: translateY(-25px) scale(1.08);
      }

      62% {
        transform: translateY(8px) scale(0.97);
      }

      80% {
        transform: translateY(-10px) scale(1.03);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    /* =========================================
       LOGO FLOATING
       ========================================= */

    @keyframes logoFloating {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }

    }


    /* =========================================
       EFEK PASSWORD SALAH
       SEMUA GAMBAR BERGETAR + MERAH
       ========================================= */

    .password-image-error {

      animation:
        passwordImageError 0.6s ease-in-out;

      filter:
        brightness(0.75)
        saturate(2)
        drop-shadow(0 0 8px rgba(255, 0, 0, 0.95))
        drop-shadow(0 0 18px rgba(255, 0, 0, 0.8))
        drop-shadow(0 0 30px rgba(255, 0, 0, 0.5));

    }


    /* =========================================
       ANIMASI GETAR
       ========================================= */

    @keyframes passwordImageError {

      0% {
        transform: translateX(0) scale(1);
      }

      15% {
        transform: translateX(-12px) scale(1.02);
      }

      30% {
        transform: translateX(12px) scale(1.02);
      }

      45% {
        transform: translateX(-10px) scale(1.01);
      }

      60% {
        transform: translateX(10px) scale(1.01);
      }

      75% {
        transform: translateX(-6px) scale(1);
      }

      90% {
        transform: translateX(6px) scale(1);
      }

      100% {
        transform: translateX(0) scale(1);
      }

    }


    /* =========================================
       EFEK MERAH PASSWORD SCREEN
       ========================================= */

    .password-screen-error {
      animation:
        passwordScreenError 0.6s ease-in-out;
    }


    @keyframes passwordScreenError {

      0% {
        box-shadow:
          inset 0 0 0 rgba(255, 0, 0, 0);
      }

      30% {
        box-shadow:
          inset 0 0 80px rgba(255, 0, 0, 0.18);
      }

      60% {
        box-shadow:
          inset 0 0 120px rgba(255, 0, 0, 0.25);
      }

      100% {
        box-shadow:
          inset 0 0 0 rgba(255, 0, 0, 0);
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       HALAMAN PASSWORD
       ========================================= -->

  <div
    class="password-screen"
    id="passwordScreen"
  >

    <img
      src="https://raw.githubusercontent.com/Pragas123/assets/refs/heads/main/nmqo6a.png"
      alt="Logo Psikotes Sugar Group Schools"
      class="password-logo"
      id="passwordLogo"
      draggable="false"
    >


    <div
      class="welcome-message"
      id="welcomeMessage"
    >
      Selamat datang di Psikotes Sugar Group Schools
    </div>


    <div
      class="password-form"
      id="passwordForm"
    >

      <input
        type="password"
        class="password-input"
        id="passwordInput"
        placeholder="Masukkan Kode Akses"
        autocomplete="off"
      >


      <button
        type="button"
        class="password-submit"
        onclick="checkPassword()"
      >
        Masuk
      </button>


      <div
        class="password-error"
        id="passwordError"
      ></div>

    </div>

  </div>


  <!-- =========================================
       TEMPAT APLIKASI UTAMA
       ========================================= -->

  <div id="app"></div>


  <!-- =========================================
       CANVAS GRAFIK DISC
       ========================================= -->

  <canvas
    id="discMost"
    width="170"
    height="420"
    style="display: none;"
  ></canvas>


  <canvas
    id="discLeast"
    width="170"
    height="420"
    style="display: none;"
  ></canvas>


  <canvas
    id="discChange"
    width="170"
    height="420"
    style="display: none;"
  ></canvas>


  <!-- =========================================
       CANVAS GRAFIK KRAEPELIN
       ========================================= -->

  <canvas
    id="kraeplinGraph"
    width="1000"
    height="320"
    style="display: none;"
  ></canvas>


  <!-- =========================================
       jsPDF
       ========================================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ></script>


  <!-- =========================================
       Chart.js
       ========================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js"
  ></script>


  <!-- =========================================
       JavaScript utama
       ========================================= -->

  <script src="./script.js"></script>


  <script>


    /* =========================================
       SUARA PASSWORD SALAH
       
       POLA:
       TET → TEEEEET
       
       Suara dibuat menggunakan Web Audio API.
       ========================================= */

    let wrongPasswordAudioContext = null;


    function playWrongPasswordAlarm() {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        if (!AudioContext) {
          return;
        }


        /* =====================================
           BUAT AUDIO CONTEXT
           ===================================== */

        if (!wrongPasswordAudioContext) {

          wrongPasswordAudioContext =
            new AudioContext();

        }


        const ctx =
          wrongPasswordAudioContext;


        /* Browser tertentu melakukan suspend
           terhadap AudioContext */

        if (ctx.state === "suspended") {

          ctx.resume();

        }


        const now =
          ctx.currentTime;


        /* =====================================
           OSCILLATOR
           ===================================== */

        const oscillator =
          ctx.createOscillator();


        const gain =
          ctx.createGain();


        /*
          Square wave memberikan karakter
          elektronik / digital.
        */

        oscillator.type = "square";


        /* =====================================
           POLA FREKUENSI
           
           TET
           ↓
           jeda pendek
           ↓
           TEEEEET
           ===================================== */


        /* TET pertama */

        oscillator.frequency.setValueAtTime(
          880,
          now
        );


        oscillator.frequency.setValueAtTime(
          880,
          now + 0.12
        );


        /* Jeda */

        oscillator.frequency.setValueAtTime(
          520,
          now + 0.15
        );


        /* TEEEEET kedua */

        oscillator.frequency.setValueAtTime(
          660,
          now + 0.18
        );


        oscillator.frequency.setValueAtTime(
          660,
          now + 0.55
        );


        /* Sedikit naik di bagian akhir */

        oscillator.frequency.setValueAtTime(
          740,
          now + 0.60
        );


        oscillator.frequency.setValueAtTime(
          740,
          now + 0.68
        );


        /* =====================================
           VOLUME
           ===================================== */

        gain.gain.setValueAtTime(
          0.0001,
          now
        );


        /* TET pertama */

        gain.gain.exponentialRampToValueAtTime(
          0.45,
          now + 0.015
        );


        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 0.13
        );


        /* TEEEEET kedua */

        gain.gain.exponentialRampToValueAtTime(
          0.45,
          now + 0.18
        );


        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 0.74
        );


        /* =====================================
           HUBUNGKAN AUDIO
           ===================================== */

        oscillator.connect(gain);

        gain.connect(
          ctx.destination
        );


        /* =====================================
           MULAI SUARA
           ===================================== */

        oscillator.start(now);


        /* =====================================
           HENTIKAN SUARA
           ===================================== */

        oscillator.stop(
          now + 0.78
        );


      } catch (error) {

        console.warn(
          "Alarm password salah gagal diputar:",
          error
        );

      }

    }



    /* =========================================
       EFEK PASSWORD SALAH
       SEMUA GAMBAR BERGETAR + MERAH
       ========================================= */

    function passwordWrongImageEffect() {

      const images =
        document.querySelectorAll("img");


      images.forEach(function (image) {

        image.classList.remove(
          "password-image-error"
        );


        /* Paksa reflow */

        void image.offsetWidth;


        /* Jalankan ulang */

        image.classList.add(
          "password-image-error"
        );

      });


      /* =====================================
         EFEK MERAH PASSWORD SCREEN
         ===================================== */

      const passwordScreen =
        document.getElementById(
          "passwordScreen"
        );


      if (passwordScreen) {

        passwordScreen.classList.remove(
          "password-screen-error"
        );


        void passwordScreen.offsetWidth;


        passwordScreen.classList.add(
          "password-screen-error"
        );

      }


      /* =====================================
         HAPUS EFEK
         ===================================== */

      setTimeout(function () {

        document
          .querySelectorAll("img")
          .forEach(function (image) {

            image.classList.remove(
              "password-image-error"
            );

          });


        if (passwordScreen) {

          passwordScreen.classList.remove(
            "password-screen-error"
          );

        }

      }, 650);

    }



    /* =========================================
       JALANKAN SEMUA EFEK PASSWORD SALAH
       ========================================= */

    function runWrongPasswordEffects() {

      /* Visual */

      passwordWrongImageEffect();


      /* Audio */

      playWrongPasswordAlarm();

    }



    /* =========================================
       MENCEGAH GAMBAR DI-DRAG
       ========================================= */

    document.addEventListener(
      "dragstart",
      function (event) {

        if (
          event.target instanceof
          HTMLImageElement
        ) {

          event.preventDefault();

        }

      }
    );



    /* =========================================
       MENONAKTIFKAN KLIK KANAN
       ========================================= */

    document.addEventListener(
      "contextmenu",
      function (event) {

        event.preventDefault();

        return false;

      }
    );



    /* =========================================
       MENONAKTIFKAN DRAG GAMBAR
       ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        document
          .querySelectorAll("img")
          .forEach(function (image) {

            image.setAttribute(
              "draggable",
              "false"
            );

          });

      }
    );



    /* =========================================
       OBSERVER GAMBAR DINAMIS
       ========================================= */

    const imageObserver =
      new MutationObserver(
        function (mutations) {

          mutations.forEach(
            function (mutation) {

              mutation.addedNodes.forEach(
                function (node) {


                  /* Node langsung berupa gambar */

                  if (
                    node instanceof
                    HTMLImageElement
                  ) {

                    node.setAttribute(
                      "draggable",
                      "false"
                    );

                  }


                  /* Elemen yang berisi gambar */

                  if (
                    node instanceof
                    HTMLElement
                  ) {

                    node
                      .querySelectorAll("img")
                      .forEach(
                        function (image) {

                          image.setAttribute(
                            "draggable",
                            "false"
                          );

                        }
                      );

                  }

                }
              );

            }
          );

        }
      );


    imageObserver.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );



    /* =========================================
       DETEKSI SETIAP KLIK MASUK
       
       Efek dijalankan SETIAP KALI password
       salah, meskipun pesan error tetap sama.
       ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const loginButton =
          document.querySelector(
            ".password-submit"
          );


        const passwordInput =
          document.getElementById(
            "passwordInput"
          );


        const passwordError =
          document.getElementById(
            "passwordError"
          );


        if (
          !loginButton ||
          !passwordInput ||
          !passwordError
        ) {

          return;

        }


        /* =====================================
           KLIK TOMBOL MASUK
           ===================================== */

        loginButton.addEventListener(
          "click",
          function () {

            setTimeout(
              function () {

                const errorText =
                  passwordError.textContent.trim();


                const passwordScreen =
                  document.getElementById(
                    "passwordScreen"
                  );


                if (
                  errorText !== "" &&
                  passwordScreen
                ) {

                  runWrongPasswordEffects();

                }

              },
              100
            );

          }
        );



        /* =====================================
           ENTER PADA KOLOM PASSWORD
           ===================================== */

        passwordInput.addEventListener(
          "keydown",
          function (event) {

            if (
              event.key !== "Enter"
            ) {

              return;

            }


            setTimeout(
              function () {

                const errorText =
                  passwordError.textContent.trim();


                const passwordScreen =
                  document.getElementById(
                    "passwordScreen"
                  );


                if (
                  errorText !== "" &&
                  passwordScreen
                ) {

                  runWrongPasswordEffects();

                }

              },
              100
            );

          }
        );

      }
    );

  </script>


</body>

</html>
