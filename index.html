<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<style>
  .password-logo {
    animation: passwordLogoSpin 2.2s linear infinite;
    transform-origin: center center;
    transform-style: preserve-3d;
    will-change: transform;
  }

  @keyframes passwordLogoSpin {
    0% {
      transform: perspective(800px) rotateY(0deg);
    }

    90.9% {
      transform: perspective(800px) rotateY(0deg);
    }

    100% {
      transform: perspective(800px) rotateY(360deg);
    }
  }
</style>

<img
  src="https://raw.githubusercontent.com/Pragas123/assets/refs/heads/main/nmqo6a.png"
  alt="Logo Psikotes Sugar Group Schools"
  class="password-logo"
  id="passwordLogo"
  draggable="false"
>

<div
  class="welcome-message"
  id="welcomeMessage"
>
  Selamat datang di Psikotes Sugar Group Schools
</div>

<div
  class="password-form"
  id="passwordForm"
>

  <input
    type="password"
    class="password-input"
    id="passwordInput"
    placeholder="Masukkan Kode Akses"
    autocomplete="off"
  >

  <button
    type="button"
    class="password-submit"
    onclick="checkPassword()"
  >
    Masuk
  </button>

  <div
    class="password-error"
    id="passwordError"
  ></div>

</div>

<canvas
  id="discMost"
  width="170"
  height="420"
  style="display: none;"
></canvas>

<canvas
  id="discLeast"
  width="170"
  height="420"
  style="display: none;"
></canvas>

<canvas
  id="discChange"
  width="170"
  height="420"
  style="display: none;"
></canvas>

<canvas
  id="kraeplinGraph"
  width="1000"
  height="320"
  style="display: none;"
></canvas>
