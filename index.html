<!-- =====================================================
     FUTURISTIC LOGO ANIMATION
     HANYA MENAMBAHKAN GERAKAN PADA #passwordLogo
     ===================================================== -->

<style>

#passwordLogo {

  transform-origin: center center;

  transform-style: preserve-3d;

  backface-visibility: visible;

  -webkit-backface-visibility: visible;

  will-change:
    transform,
    filter;

  animation:
    futuristicLogoMotion
    6.5s
    cubic-bezier(0.22, 1, 0.36, 1)
    infinite;

}


/* =====================================================
   GERAKAN FUTURISTIK
   ===================================================== */

@keyframes futuristicLogoMotion {

  /* ---------------------------------------------------
     POSISI AWAL
     --------------------------------------------------- */

  0% {

    transform:
      perspective(1200px)
      translate3d(0, 0, 0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale3d(1, 1, 1);

    filter:
      brightness(1)
      drop-shadow(
        0 12px 24px
        rgba(0, 0, 0, 0.12)
      );

  }


  /* ---------------------------------------------------
     MULAI BERGERAK KE KIRI
     --------------------------------------------------- */

  10% {

    transform:
      perspective(1200px)
      translate3d(-2px, -2px, 8px)
      rotateX(1deg)
      rotateY(-7deg)
      rotateZ(-0.3deg)
      scale3d(1.012, 1.012, 1.012);

    filter:
      brightness(1.02)
      drop-shadow(
        0 0 5px
        rgba(255, 255, 255, 0.12)
      )
      drop-shadow(
        0 15px 28px
        rgba(0, 0, 0, 0.14)
      );

  }


  /* ---------------------------------------------------
     ROTASI KE SAMPING
     --------------------------------------------------- */

  22% {

    transform:
      perspective(1200px)
      translate3d(-5px, 0, 18px)
      rotateX(2deg)
      rotateY(-18deg)
      rotateZ(-0.7deg)
      scale3d(1.035, 1.035, 1.035);

    filter:
      brightness(1.06)
      drop-shadow(
        0 0 12px
        rgba(255, 255, 255, 0.18)
      )
      drop-shadow(
        0 20px 38px
        rgba(0, 0, 0, 0.17)
      );

  }


  /* ---------------------------------------------------
     OVERSHOOT KECIL
     --------------------------------------------------- */

  30% {

    transform:
      perspective(1200px)
      translate3d(-3px, 1px, 12px)
      rotateX(1deg)
      rotateY(-13deg)
      rotateZ(-0.4deg)
      scale3d(1.025, 1.025, 1.025);

  }


  /* ---------------------------------------------------
     KEMBALI KE TENGAH
     --------------------------------------------------- */

  42% {

    transform:
      perspective(1200px)
      translate3d(0, 0, 0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale3d(1, 1, 1);

    filter:
      brightness(1)
      drop-shadow(
        0 12px 24px
        rgba(0, 0, 0, 0.12)
      );

  }


  /* ---------------------------------------------------
     JEDA NATURAL
     --------------------------------------------------- */

  48% {

    transform:
      perspective(1200px)
      translate3d(0, 0, 0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale3d(1, 1, 1);

  }


  /* ---------------------------------------------------
     MULAI BERGERAK KE KANAN
     --------------------------------------------------- */

  58% {

    transform:
      perspective(1200px)
      translate3d(2px, -2px, 8px)
      rotateX(-1deg)
      rotateY(7deg)
      rotateZ(0.3deg)
      scale3d(1.012, 1.012, 1.012);

    filter:
      brightness(1.02)
      drop-shadow(
        0 0 5px
        rgba(255, 255, 255, 0.12)
      )
      drop-shadow(
        0 15px 28px
        rgba(0, 0, 0, 0.14)
      );

  }


  /* ---------------------------------------------------
     ROTASI KE SISI KANAN
     --------------------------------------------------- */

      )
      drop-shadow(
        0 20px 38px
        rgba(0, 0, 0, 0.17)
      );

  }


  /* ---------------------------------------------------
     OVERSHOOT
     --------------------------------------------------- */

  78% {

    transform:
      perspective(1200px)
      translate3d(3px, 1px, 12px)
      rotateX(-1deg)
      rotateY(13deg)
      rotateZ(0.4deg)
      scale3d(1.025, 1.025, 1.025);

  }


  /* ---------------------------------------------------
     KEMBALI KE TENGAH
     --------------------------------------------------- */

  90% {

      rotateZ(0deg)

        0 12px 24px
        rgba(0, 0, 0, 0.12)
      );

  }

}


/* =====================================================
   INTERAKSI MOUSE
   ===================================================== */

#passwordLogo:hover {

  animation-play-state: paused;

  transform:
    perspective(900px)
    translate3d(0, -3px, 20px)
    rotateX(-3deg)
    rotateY(14deg)
    rotateZ(0deg)
    scale3d(1.04, 1.04, 1.04);

  filter:
    brightness(1.08)
    drop-shadow(
      0 0 10px
      rgba(255, 255, 255, 0.18)
    )
    drop-shadow(
      0 20px 40px
      rgba(0, 0, 0, 0.18)
    );

}


/* =====================================================
   MOBILE / REDUCED MOTION
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

  #passwordLogo {

    animation: none;

    transform:
      translateZ(0);

    transition: none;

  }

}

</style>


<script>

/* =====================================================
   FUTURISTIC MICRO PARALLAX
   HANYA #passwordLogo
   ===================================================== */

(function () {

  const logo =
    document.getElementById("passwordLogo");

  if (!logo) return;


  let mouseX = 0;
  let mouseY = 0;

  let currentX = 0;
  let currentY = 0;


  document.addEventListener(
    "mousemove",
    function (event) {

      const x =
        (event.clientX /
          window.innerWidth) -
        0.5;

      const y =
        (event.clientY /
          window.innerHeight) -
        0.5;


      mouseX = x * 4;

      mouseY = y * -4;

    },
    { passive: true }
  );


  function updateLogo() {

    currentX +=
      (mouseX - currentX) * 0.035;

    currentY +=
      (mouseY - currentY) * 0.035;


    if (!logo.matches(":hover")) {

      logo.style.setProperty(
        "--logoMouseX",
        currentX.toFixed(3) + "deg"
      );

      logo.style.setProperty(
        "--logoMouseY",
        currentY.toFixed(3) + "deg"
      );

    }


    requestAnimationFrame(updateLogo);

  }


  updateLogo();

})();

</script>
