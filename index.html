<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Psikotes Sugar Group Schools</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="https://raw.githubusercontent.com/Pragas123/assets/refs/heads/main/nmqo6a.png"
  >

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS utama -->
  <link rel="stylesheet" href="./style.css">

  <style>

    /* =========================================
       MENCEGAH SEMUA GAMBAR DI-DRAG
       ========================================= */

    img {
      -webkit-user-drag: none;
      user-drag: none;

      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;

      pointer-events: auto;
    }


    /* =========================================
       ANIMASI LOGO
       1. Meloncat saat pertama muncul
       2. Bergerak naik-turun terus-menerus
       ========================================= */

    .password-logo {
      animation:
        logoJumpIn 1s ease-out both,
        logoFloating 2.5s ease-in-out 1s infinite;

      transform-origin: center bottom;
      will-change: transform, opacity;
    }


    /* Animasi saat pertama kali logo muncul */

    @keyframes logoJumpIn {

      0% {
        opacity: 0;
        transform: translateY(70px) scale(0.75);
      }

      42% {
        opacity: 1;
        transform: translateY(-25px) scale(1.08);
      }

      62% {
        transform: translateY(8px) scale(0.97);
      }

      80% {
        transform: translateY(-10px) scale(1.03);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    /* Animasi naik-turun setelah logo selesai meloncat */

    @keyframes logoFloating {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }

    }


    /* =========================================
       EFEK PASSWORD SALAH
       SEMUA GAMBAR BERGETAR + MERAH
       ========================================= */

    .password-image-error {

      animation:
        passwordImageError 0.6s ease-in-out;

      filter:
        brightness(0.75)
        saturate(2)
        drop-shadow(0 0 8px rgba(255, 0, 0, 0.95))
        drop-shadow(0 0 18px rgba(255, 0, 0, 0.8))
        drop-shadow(0 0 30px rgba(255, 0, 0, 0.5));

    }


    /* =========================================
       ANIMASI GETAR PASSWORD SALAH
       ========================================= */

    @keyframes passwordImageError {

      0% {
        transform: translateX(0) scale(1);
      }

      15% {
        transform: translateX(-12px) scale(1.02);
      }

      30% {
        transform: translateX(12px) scale(1.02);
      }

      45% {
        transform: translateX(-10px) scale(1.01);
      }

      60% {
        transform: translateX(10px) scale(1.01);
      }

      75% {
        transform: translateX(-6px) scale(1);
      }

      90% {
        transform: translateX(6px) scale(1);
      }

      100% {
        transform: translateX(0) scale(1);
      }

    }


    /* =========================================
       EFEK MERAH PADA HALAMAN PASSWORD
       SAAT PASSWORD SALAH
       ========================================= */

    .password-screen-error {
      animation: passwordScreenError 0.6s ease-in-out;
    }


    @keyframes passwordScreenError {

      0% {
        box-shadow: inset 0 0 0 rgba(255, 0, 0, 0);
      }

      30% {
        box-shadow:
          inset 0 0 80px rgba(255, 0, 0, 0.18);
      }

      60% {
        box-shadow:
          inset 0 0 120px rgba(255, 0, 0, 0.25);
      }

      100% {
        box-shadow: inset 0 0 0 rgba(255, 0, 0, 0);
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       HALAMAN PASSWORD
       ========================================= -->

  <div
    class="password-screen"
    id="passwordScreen"
  >

    <img
      src="https://raw.githubusercontent.com/Pragas123/assets/refs/heads/main/nmqo6a.png"
      alt="Logo Psikotes Sugar Group Schools"
      class="password-logo"
      id="passwordLogo"
      draggable="false"
    >


    <div
      class="welcome-message"
      id="welcomeMessage"
    >
      Selamat datang di Psikotes Sugar Group Schools
    </div>


    <div
      class="password-form"
      id="passwordForm"
    >

      <input
        type="password"
        class="password-input"
        id="passwordInput"
        placeholder="Masukkan Kode Akses"
        autocomplete="off"
      >


      <button
        type="button"
        class="password-submit"
        onclick="checkPassword()"
      >
        Masuk
      </button>


      <div
        class="password-error"
        id="passwordError"
      ></div>

    </div>

  </div>


  <!-- =========================================
       TEMPAT APLIKASI UTAMA
       ========================================= -->

  <div id="app"></div>


  <!-- =========================================
       CANVAS GRAFIK DISC
       Hidden tetapi harus tetap ada di DOM
       ========================================= -->

  <canvas
    id="discMost"
    width="170"
    height="420"
    style="display: none;"
  ></canvas>


  <canvas
    id="discLeast"
    width="170"
    height="420"
    style="display: none;"
  ></canvas>


  <canvas
    id="discChange"
    width="170"
    height="420"
    style="display: none;"
  ></canvas>


  <!-- =========================================
       CANVAS GRAFIK KRAEPELIN
       Hidden dan digunakan untuk PDF
       ========================================= -->

  <canvas
    id="kraeplinGraph"
    width="1000"
    height="320"
    style="display: none;"
  ></canvas>


  <!-- =========================================
       jsPDF
       ========================================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ></script>


  <!-- =========================================
       Chart.js
       ========================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js"
  ></script>


  <!-- =========================================
       JavaScript utama
       ========================================= -->

  <script src="./script.js"></script>


  <script>


    /* =========================================
       SUARA ALARM PASSWORD SALAH
       TTEEEEET!
       ========================================= */

    let wrongPasswordAudioContext = null;

    function playWrongPasswordAlarm() {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContext) return;


        /* Buat AudioContext hanya ketika
           diperlukan */

        if (!wrongPasswordAudioContext) {

          wrongPasswordAudioContext =
            new AudioContext();

        }


        const audioContext =
          wrongPasswordAudioContext;


        /* Jika browser sedang suspend,
           lanjutkan kembali */

        if (
          audioContext.state === "suspended"
        ) {

          audioContext.resume();

        }


        const oscillator =
          audioContext.createOscillator();

        const gainNode =
          audioContext.createGain();


        /* =====================================
           KARAKTER SUARA
           ===================================== */

        oscillator.type = "square";


        /* Frekuensi awal */

        oscillator.frequency.setValueAtTime(
          720,
          audioContext.currentTime
        );


        /* Turun seperti suara alarm
           "TTEEEEET" */

        oscillator.frequency.exponentialRampToValueAtTime(
          420,
          audioContext.currentTime + 0.75
        );


        /* =====================================
           VOLUME
           ===================================== */

        gainNode.gain.setValueAtTime(
          0.0001,
          audioContext.currentTime
        );


        gainNode.gain.exponentialRampToValueAtTime(
          0.38,
          audioContext.currentTime + 0.025
        );


        gainNode.gain.exponentialRampToValueAtTime(
          0.0001,
          audioContext.currentTime + 0.85
        );


        /* Hubungkan suara */

        oscillator.connect(gainNode);

        gainNode.connect(
          audioContext.destination
        );


        /* Mulai */

        oscillator.start();


        /* Berhenti */

        oscillator.stop(
          audioContext.currentTime + 0.85
        );


      } catch (error) {

        console.warn(
          "Alarm audio tidak dapat diputar:",
          error
        );

      }

    }



    /* =========================================
       EFEK PASSWORD SALAH
       SEMUA GAMBAR BERGETAR + MERAH
       ========================================= */

    function passwordWrongImageEffect() {

      const images =
        document.querySelectorAll("img");


      images.forEach(function (image) {

        /* Hapus class terlebih dahulu */

        image.classList.remove(
          "password-image-error"
        );


        /* Paksa browser melakukan reflow */

        void image.offsetWidth;


        /* Tambahkan efek */

        image.classList.add(
          "password-image-error"
        );

      });


      /* Efek merah pada password screen */

      const passwordScreen =
        document.getElementById(
          "passwordScreen"
        );


      if (passwordScreen) {

        passwordScreen.classList.remove(
          "password-screen-error"
        );


        void passwordScreen.offsetWidth;


        passwordScreen.classList.add(
          "password-screen-error"
        );

      }


      /* Hapus efek setelah animasi */

      setTimeout(function () {

        document
          .querySelectorAll("img")
          .forEach(function (image) {

            image.classList.remove(
              "password-image-error"
            );

          });


        if (passwordScreen) {

          passwordScreen.classList.remove(
            "password-screen-error"
          );

        }

      }, 650);

    }



    /* =========================================
       MENJALANKAN SEMUA EFEK PASSWORD SALAH
       ========================================= */

    function runWrongPasswordEffects() {

      /* Efek visual */

      passwordWrongImageEffect();


      /* Suara alarm */

      playWrongPasswordAlarm();

    }



    /* =========================================
       MENCEGAH GAMBAR DI-DRAG
       Termasuk gambar yang dibuat oleh script.js
       ========================================= */

    document.addEventListener(
      "dragstart",
      function (event) {

        if (
          event.target instanceof
          HTMLImageElement
        ) {

          event.preventDefault();

        }

      }
    );



    /* =========================================
       MENONAKTIFKAN KLIK KANAN
       DI SELURUH HALAMAN
       ========================================= */

    document.addEventListener(
      "contextmenu",
      function (event) {

        event.preventDefault();

        return false;

      }
    );



    /* =========================================
       MENONAKTIFKAN DRAG GAMBAR
       SAAT HALAMAN DIMUAT
       ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        document
          .querySelectorAll("img")
          .forEach(function (image) {

            image.setAttribute(
              "draggable",
              "false"
            );

          });

      }
    );



    /* =========================================
       MENGAWASI GAMBAR BARU
       YANG DITAMBAHKAN script.js
       ========================================= */

    const imageObserver =
      new MutationObserver(
        function (mutations) {

          mutations.forEach(
            function (mutation) {

              mutation.addedNodes.forEach(
                function (node) {


                  /* Jika node langsung
                     berupa gambar */

                  if (
                    node instanceof
                    HTMLImageElement
                  ) {

                    node.setAttribute(
                      "draggable",
                      "false"
                    );

                  }


                  /* Jika node berupa elemen
                     yang memiliki gambar */

                  if (
                    node instanceof
                    HTMLElement
                  ) {

                    node
                      .querySelectorAll("img")
                      .forEach(
                        function (image) {

                          image.setAttribute(
                            "draggable",
                            "false"
                          );

                        }
                      );

                  }

                }
              );

            }
          );

        }
      );


    /* =========================================
       AKTIFKAN IMAGE OBSERVER
       ========================================= */

    imageObserver.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );



    /* =========================================
       DETEKSI PASSWORD SALAH
       
       Memantau perubahan pada
       #passwordError yang digunakan
       oleh checkPassword() di script.js.
       ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const passwordError =
          document.getElementById(
            "passwordError"
          );


        if (!passwordError) return;


        let previousErrorText = "";


        const passwordErrorObserver =
          new MutationObserver(
            function () {

              const errorText =
                passwordError.textContent.trim();


              /* Jalankan hanya jika pesan error
                 berubah dari kosong menjadi
                 pesan error baru */

              if (
                errorText !== "" &&
                errorText !== previousErrorText
              ) {

                previousErrorText =
                  errorText;


                runWrongPasswordEffects();

              }


              /* Reset status ketika error
                 kembali kosong */

              if (errorText === "") {

                previousErrorText = "";

              }

            }
          );


        passwordErrorObserver.observe(
          passwordError,
          {
            childList: true,
            characterData: true,
            subtree: true
          }
        );

      }
    );

  </script>


</body>

</html>
