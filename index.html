<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<img
  src="https://raw.githubusercontent.com/Pragas123/assets/refs/heads/main/nmqo6a.png"
  alt="Logo Psikotes Sugar Group Schools"
  class="password-logo"
  id="passwordLogo"
  draggable="false"
>

<div
  class="welcome-message"
  id="welcomeMessage"
>
  Selamat datang di Psikotes Sugar Group Schools
</div>

<div
  class="password-form"
  id="passwordForm"
>

  <input
    type="password"
    class="password-input"
    id="passwordInput"
    placeholder="Masukkan Kode Akses"
    autocomplete="off"
  >

  <button
    type="button"
    class="password-submit"
    onclick="checkPassword()"
  >
    Masuk
  </button>

  <div
    class="password-error"
    id="passwordError"
  ></div>

</div>

<canvas

height="420"
style="display: none;"

width="170"
height="420"
style="display: none;"

>

<canvas
id="discChange"
width="170"
height="420"
style="display: none;"

>

<canvas
id="kraeplinGraph"

<!-- =====================================================
     TAMBAHAN ANIMASI LOGO SAJA
     TIDAK MENGUBAH KOMPONEN DI ATAS
     ===================================================== -->

<style>

#passwordLogo {
  transform-origin: center center;
  transform-style: preserve-3d;
  backface-visibility: visible;
  -webkit-backface-visibility: visible;
  will-change: transform, filter;

  animation:
    passwordLogoFuturistic
    7s
    cubic-bezier(0.22, 1, 0.36, 1)
    infinite;
}


/* =====================================================
   ANIMASI UTAMA
   GERAKAN KIRI → DEPAN → KANAN → DEPAN
   ===================================================== */

@keyframes passwordLogoFuturistic {

  0% {
    transform:
      perspective(1200px)
      translate3d(0, 0, 0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale(1);

    filter:
      brightness(1)
      drop-shadow(
        0 10px 22px
        rgba(0,0,0,0.12)
      );
  }


  /* Mulai bergerak */

  12% {
    transform:
      perspective(1200px)
      translate3d(-2px, -2px, 8px)
      rotateX(1deg)
      rotateY(-7deg)
      rotateZ(-0.3deg)
      scale(1.01);

    filter:
      brightness(1.02)
      drop-shadow(
        0 0 5px
        rgba(255,255,255,0.12)
      )
      drop-shadow(
        0 14px 28px
        rgba(0,0,0,0.14)
      );
  }


  /* Rotasi samping kiri */

  24% {
    transform:
      perspective(1200px)
      translate3d(-5px, 0, 18px)
      rotateX(2deg)
      rotateY(-18deg)
      rotateZ(-0.6deg)
      scale(1.035);

    filter:
      brightness(1.07)
      drop-shadow(
        0 0 13px
        rgba(255,255,255,0.18)
      )
      drop-shadow(
        0 20px 38px
        rgba(0,0,0,0.18)
      );
  }


  /* Sedikit recoil */

  31% {
    transform:
      perspective(1200px)
      translate3d(-3px, 1px, 12px)
      rotateX(1deg)
      rotateY(-13deg)
      rotateZ(-0.3deg)
      scale(1.025);
  }


  /* Kembali ke depan */

  42% {
    transform:
      perspective(1200px)
      translate3d(0, 0, 0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale(1);

    filter:
      brightness(1)
      drop-shadow(
        0 10px 22px
        rgba(0,0,0,0.12)
      );
  }


  /* Diam sesaat */

  50% {
    transform:
      perspective(1200px)
      translate3d(0, 0, 0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale(1);
  }


  /* Mulai bergerak ke kanan */

  60% {
    transform:
      perspective(1200px)
      translate3d(2px, -2px, 8px)
      rotateX(-1deg)
      rotateY(7deg)
      rotateZ(0.3deg)
      scale(1.01);

    filter:
      brightness(1.02)
      drop-shadow(
        0 0 5px
        rgba(255,255,255,0.12)
      )
      drop-shadow(
        0 14px 28px
        rgba(0,0,0,0.14)
      );
  }


  /* Rotasi samping kanan */

  72% {
    transform:
      perspective(1200px)
      translate3d(5px, 0, 18px)
      rotateX(-2deg)
      rotateY(18deg)
      rotateZ(0.6deg)
      scale(1.035);

    filter:
      brightness(1.07)
      drop-shadow(
        0 0 13px
        rgba(255,255,255,0.18)
      )
      drop-shadow(
        0 20px 38px
        rgba(0,0,0,0.18)
      );
  }


  /* Recoil */

  79% {
    transform:
      perspective(1200px)
      translate3d(3px, 1px, 12px)
      rotateX(-1deg)
      rotateY(13deg)
      rotateZ(0.3deg)
      scale(1.025);
  }


  /* Kembali ke depan */

  90% {
    transform:
      perspective(1200px)
      translate3d(0, 0, 0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale(1);

    filter:
      brightness(1)
      drop-shadow(
        0 10px 22px
        rgba(0,0,0,0.12)
      );
  }


  100% {
    transform:
      perspective(1200px)
      translate3d(0, 0, 0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale(1);

    filter:
      brightness(1)
      drop-shadow(
        0 10px 22px
        rgba(0,0,0,0.12)
      );
  }

}


/* =====================================================
   INTERAKSI SAAT KURSOR MENYENTUH LOGO
   ===================================================== */

#passwordLogo:hover {

  animation-play-state: paused;

  transform:
    perspective(1000px)
    translate3d(0, -3px, 20px)
    rotateX(-3deg)
    rotateY(15deg)
    rotateZ(0deg)
    scale(1.04);

  filter:
    brightness(1.08)
    drop-shadow(
      0 0 12px
      rgba(255,255,255,0.20)
    )
    drop-shadow(
      0 20px 40px
      rgba(0,0,0,0.18)
    );

}


/* =====================================================
   PERANGKAT YANG MEMILIH REDUCED MOTION
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

  #passwordLogo {
    animation: none;
    transform: none;
    filter: none;
  }

}

</style>
